# =============================================================
# テーマ（ライト固定）
# 未設定だと Streamlit 標準の赤 #FF4B4B と OS 追従のダークテーマが
# そのまま出てしまうため、ここで明示的に固定する。
# 色を変えるときは app.py 冒頭のデザイントークンと必ず揃えること。
# =============================================================
[theme]
base = "light"
primaryColor = "#1F3A5F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F8FA"
textColor = "#1A2230"

[client]
toolbarMode = "minimal"

# 未捕捉の例外のスタックトレースを画面に出さない。
# 既定の "full" ではファイルパス・内部構造が利用者に見えてしまうため。
# アプリ側で明示的に出している st.error（APIエラー等）はこの設定の影響を受けず、
# これまでどおり表示される。
# 開発中に詳細を見たいときは "full" に戻すか、サーバー側のログを参照すること。
showErrorDetails = "none"
